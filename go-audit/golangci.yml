# The config of golangci-lint for the checks golangci-lint and exhaustruct
# of go-audit, the same for every module, whatever config the module has;
# the module's own config runs as the check golangci-project.
#
# This is the built-in one: go-audit gives golangci-lint a copy of it in the
# output of the run. "go-audit config -init" puts it into the store as
# golangci.yml, which then replaces it as a whole.
#
# The linters are the standard set: errcheck, govet, ineffassign, staticcheck
# and unused. golangci-lint help linters lists the others.
version: "2"

linters:
  default: standard
  # enable:
  #   - errorlint
  #   - misspell

  settings:
    # The check exhaustruct runs this linter alone. It checks the literals of
    # the types marked //exhaustruct:enforce, and of those enforce-patterns
    # names, for fields left out; //exhaustruct:optional on a field lets it
    # be. Checking every type, as exhaustruct does by default, would ask for
    # the fields of zero value that the Go style guides leave out.
    exhaustruct_v5:
      explicit-mode: true
      # enforce-patterns:
      #   - example\.com/m/config\..*
